        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  backupFolderPath: { type: string }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/tray/status:
    get:
      tags: [native]
      description: |
        Host hỏi tiến trình Tray qua named pipe của user hiện tại. Tray không chạy thì vẫn
        trả 200 với `running: false` (đó là trạng thái, không phải lỗi).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrayStatus' }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/tray/services/{name}:
    post:
      tags: [native]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [playtime, scanner, backup] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: OK }
        '409':
          description: Tray không chạy (TRAY_NOT_RUNNING) hoặc không bật/tắt được dịch vụ (TRAY_COMMAND_FAILED)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/tray/sync-images:
    post:
      tags: [native]
      summary: Đưa ảnh banner/backdrop/poster trong thư viện của người đang đăng nhập về nơi lưu
      description: |
        Nơi lưu theo chủ thư viện (DOMAIN_RULES §12): tài khoản admin → Cloudinary;
        user, guest → lưu trên máy (`/local-images/...`). Trong báo cáo, `uploaded` là
        số ảnh vừa lưu tới nơi đó.
        Chạy trong Host, không cần tiến trình Tray. Đồng bộ (trả báo cáo khi xong),
        chưa qua /api/events. Chỉ thay đúng cột ảnh và chỉ khi giá trị chưa đổi
        trong lúc chạy. Ảnh đã ở đúng nơi lưu thì bỏ qua.
      responses:
        '200':
          description: Báo cáo, kèm lý do từng ảnh lỗi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageSyncReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Đang có một lần đồng bộ ảnh khác chạy (IMAGE_SYNC_RUNNING)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Thư viện admin nhưng chưa cấu hình Cloudinary (INTEGRATION_NOT_CONFIGURED)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/tray/{action}:
    post:
      tags: [native]
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [scan-now, backup-now, open-logs, startup]
      description: |
        Đã cài `scan-now` và `open-logs`. `backup-now` (backup đang tắt) và `startup` trả 501.
      responses:
        '202': { description: Đã nhận, tiến độ đẩy qua /api/events }
        '409':
          description: Tray không chạy (TRAY_NOT_RUNNING), hoặc dịch vụ quét thư viện đang tắt (SCANNER_STOPPED)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

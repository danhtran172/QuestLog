        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/admin/metadata/crawler/games:
    get:
      tags: [admin]
      summary: Các metadata game crawler đang theo dõi (admin-only)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Game đã có source snapshot crawler.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCrawlerTrackedGamePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin required }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/admin/integrations:
    get:
      tags: [admin]
      summary: Liệt kê trạng thái cấu hình integration (admin-only)
      responses:
        '200':
          description: Chỉ metadata an toàn, không bao giờ có credential.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IntegrationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin required }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/admin/integrations/{provider}:
    put:
      tags: [admin]
      summary: Thay thế trọn bộ credential của một provider (admin-only)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IntegrationProvider' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationCredentialsWrite' }
      responses:
        '200':
          description: Metadata sau khi thay thế; không có credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin required }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/admin/integrations/{provider}/test:
    post:
      tags: [admin]
      summary: Chạy kiểm tra kết nối read-only cho một provider (admin-only)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IntegrationProvider' }
      responses:
        '200':
          description: Metadata chứa kết quả test an toàn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin required }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { description: Quá nhiều lần test }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/settings:
    get:
      tags: [settings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    put:
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }

  /api/settings/test-cloudinary:
    post:
      tags: [settings]
      summary: Ping Cloudinary thật
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /api/dashboard/stats:
    get:
      tags: [system]
      summary: Thống kê — BACKEND tính, không tính ở client
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }

  /api/events:
    get:
      tags: [system]
      summary: SSE stream
      description: |
        Sự kiện: runningProcesses, refresh, trayNotification, syncProgress.
        Thay thế cơ chế WeakReferenceMessenger + GlobalEvents của bản WPF (mismatch M40).
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  # ---------- NATIVE — chỉ Local API. Hosted trả 501 ----------

  /api/games/{id}/launch:
    post:
      tags: [native]
      summary: Khởi chạy game
      description: |
        Thứ tự: isDlc → chặn; có launchTarget → Process.Start(path, UseShellExecute=true);
        không có → tra DetectedProcess theo "{exeName}.exe".
        Không tìm thấy → lỗi có localize, KHÔNG im lặng.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Đã khởi chạy }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/fs/pick-file:
    post:
      tags: [native]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter]
              properties:
                filter:
                  type: string
                  enum: [exe-or-shortcut, database, json]
      responses:
        '200':
          description: Đường dẫn đã chọn (null nếu người dùng huỷ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: [string, "null"] }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/fs/pick-folder:
    post:
      tags: [native]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: [string, "null"] }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/fs/reveal:
    post:
      tags: [native]
      summary: Mở Explorer tại đường dẫn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        '204': { description: OK }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/games/{id}/backup-folder/generate:
    post:
      tags: [native]
      summary: Tạo backup folder tên duy nhất + ghi SaveLocation.txt
      description: Trả 501 `FEATURE_DISABLED` khi `capabilities.features.backup` là false (đang tạm tắt).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  backupFolderPath: { type: string }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/tray/status:
    get:
      tags: [native]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, enum: [playtime, scanner, backup] }
                        enabled: { type: boolean }
                        lastRunAt: { type: [string, "null"], format: date-time }
                        detail: { type: object, additionalProperties: true }
                  startWithWindows: { type: boolean }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/tray/services/{name}:
    post:
      tags: [native]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [playtime, scanner, backup] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: OK }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

  /api/tray/sync-images:
    post:
      tags: [native]
      summary: Đưa ảnh banner/backdrop/poster trong thư viện của người đang đăng nhập lên Cloudinary
      description: |
        Chạy trong Host, không cần tiến trình Tray. Đồng bộ (trả báo cáo khi xong),
        chưa qua /api/events. Chỉ thay đúng cột ảnh và chỉ khi giá trị chưa đổi
        trong lúc chạy. Ảnh đã nằm trong thư mục QuestLog/ (hoặc MasterPlay/ cũ) bỏ qua.
      responses:
        '200':
          description: Báo cáo, kèm lý do từng ảnh lỗi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageSyncReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Đang có một lần đồng bộ ảnh khác chạy (IMAGE_SYNC_RUNNING)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Chưa cấu hình Cloudinary (INTEGRATION_NOT_CONFIGURED)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/tray/{action}:
    post:
      tags: [native]
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [scan-now, backup-now, open-logs, startup]
      responses:
        '202': { description: Đã nhận, tiến độ đẩy qua /api/events }
        '501': { $ref: '#/components/responses/NotImplementedOnHosted' }

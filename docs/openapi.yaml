      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameMetadataPreviewRequest' }
      responses:
        '200':
          description: Preview metadata không persist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameMetadataPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /api/queue:
    get:
      tags: [queue]
      summary: Toàn bộ queue, đã chuẩn hoá + persist thứ tự. Không phân trang.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameListItem' }

  /api/queue/order:
    put:
      tags: [queue]
      summary: Đổi thứ tự queue
      description: |
        Client CHỈ gửi thứ tự mới. Server áp quy tắc DOMAIN_RULES §8.2:
        game Playing giữ nguyên progress; trong nhóm non-playing, 3 game ĐẦU → NextPlay,
        còn lại → Intended; persist CẢ PlayOrder LẪN ProgressId.
        Client KHÔNG được tự tính NextPlay/Intended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameIds]
              properties:
                gameIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: Queue sau khi áp quy tắc
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameListItem' }

  /api/taxonomy/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [series, genres, themes] }
    get:
      tags: [taxonomy]
      parameters:
        - name: q
          in: query
          description: Tìm theo tên; backend thực hiện lọc.
